<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green & Black Custom Wheel Spinner</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .names-list-wrapper {
            width: 100%;
            height: 220px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .name-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #171717;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            border: 1px solid #262626;
            font-size: 0.95rem;
        }
        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .odds-up-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        .odds-up-btn:hover {
            background: var(--accent-hover);
        }
        .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 0 4px;
        }
        .remove-btn:hover {
            color: #b91c1c;
        }
        .stats-table-container {
            margin-top: 2rem;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            font-size: 1rem;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .table-btn-group {
            display: flex;
            gap: 8px;
        }
        .table-remove-btn {
            background: #ef4444;
            color: #000;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .table-remove-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>

    <header>
        <div class="tabs">
            <button class="tab-btn active" id="tabWheel">🎮 Wheel Config</button>
            <button class="tab-btn" id="tabPrize">💰 Prize Pool & Odds</button>
        </div>
    </header>

    <!-- TAB 1: WHEEL SPINNER VIEW -->
    <div id="wheel-tab" class="tab-view active">
        <div class="container">
            <div class="wheel-section">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
                <div class="center-hub"></div>
            </div>

            <div class="controls-section">
                <div class="input-group">
                    <input type="text" id="newNameInput" placeholder="Enter single name...">
                    <button class="btn" id="addNameBtn">+ Name</button>
                </div>
                
                <div id="namesContainer" class="names-list-wrapper"></div>
                
                <button class="btn btn-spin" id="spinBtn">Spin Wheel</button>
            </div>
        </div>
    </div>

    <!-- TAB 2: PRIZE POOL & ODDS MATRIX DATA VIEW -->
    <div id="prize-tab" class="tab-view">
        <div class="pool-card">
            <h2>Financial Breakdown & Win Probability</h2>
            <div class="pool-grid">
                <div class="pool-stat">
                    <h3>Total Earnings</h3>
                    <div class="pool-value" id="totalEarningsDisplay">$0.00</div>
                </div>
                <div class="pool-stat">
                    <h3>Prize Pool (50%)</h3>
                    <div class="pool-value" id="prizePoolDisplay">$0.00</div>
                </div>
            </div>

            <div class="stats-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name Entry</th>
                            <th>Tickets (Weight)</th>
                            <th>Win Chance (%)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="oddsTableBody">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- IN-PAGE MODAL WINDOW -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <h2>Selected Segment</h2>
            <div class="winner-text" id="winnerText"></div>
            <button class="btn" style="width: 100%; color: #000;" id="closeModal">Remove Winner & Close</button>
        </div>
    </div>

    <script src="financials.js"></script>
    <script src="app.js"></script>
</body>
</html>
