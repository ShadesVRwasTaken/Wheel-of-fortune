<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green & Black Custom Wheel Spinner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="tabs">
            <button class="tab-btn active" id="tabWheel">🎮 Wheel Config</button>
            <button class="tab-btn" id="tabPrize">💰 Prize Pool</button>
        </div>
    </header>

    <!-- TAB 1: WHEEL SPINNER VIEW -->
    <div id="wheel-tab" class="tab-view active">
        <div class="container">
            <div class="wheel-section">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
                <div class="center-hub"></div>
            </div>

            <div class="controls-section">
                <div class="input-group">
                    <input type="text" id="newNameInput" placeholder="Enter single name...">
                    <button class="btn" id="addNameBtn">+ Name</button>
                </div>
                
                <textarea id="namesTextarea" readonly placeholder="No names added yet..."></textarea>
                <button class="btn btn-spin" id="spinBtn">Spin Wheel</button>
            </div>
        </div>
    </div>

    <!-- TAB 2: PRIZE POOL MATRIX DATA VIEW -->
    <div id="prize-tab" class="tab-view">
        <div class="pool-card">
            <h2>Financial Breakdown Dashboard</h2>
            <div class="pool-grid">
                <div class="pool-stat">
                    <h3>Total Earnings</h3>
                    <div class="pool-value" id="totalEarningsDisplay">$0.00</div>
                </div>
                <div class="pool-stat">
                    <h3>Prize Pool (50%)</h3>
                    <div class="pool-value" id="prizePoolDisplay">$0.00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- IN-PAGE MODAL WINDOW -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <h2>Selected Segment</h2>
            <div class="winner-text" id="winnerText"></div>
            <button class="btn" style="width: 100%; color: #000;" id="closeModal">Dismiss</button>
        </div>
    </div>

    <!-- Scripts at the bottom -->
    <script src="financials.js"></script>
    <script src="app.js"></script>
</body>
</html>
